name: Compilar Tarot Mod Fabric 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          unzip -o -q *.zip
          
          # Busca dónde quedó build.gradle (en la raíz o dentro de una subcarpeta)
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No se encontró build.gradle. Archivos en el repo:"
            ls -laR
            exit 1
          fi
          
          MOD_DIR=$(dirname "$BUILD_FILE")
          echo "MOD_DIR=$MOD_DIR" >> $GITHUB_ENV
          echo "Carpeta del mod detectada en: $MOD_DIR"

      - name: Configurar Python y ejecutar generadores
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar assets y datos del mod
        run: |
          cd "$MOD_DIR"
          pip install pillow || true
          for script in gen_assets.py gen_cards.py gen_bosses.py gen_data.py; do
            if [ -f "$script" ]; then
              echo "Ejecutando $script..."
              python "$script"
            fi
          done

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Compilar mod
        run: |
          cd "$MOD_DIR"
          gradle build

      - name: Subir el archivo .JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: tarot-mod-fabric-1.21.11
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
